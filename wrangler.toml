name = "vg-meta-shopagent"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [ { pattern = "shopagent.velvetgeaux.com/*", zone_name = "velvetgeaux.com", custom_domain = false } ]
[ai]
binding = "AI"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
[vars]
CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
META_MODEL = "Llama-4-Maverick-17B-128E-Instruct-FP8"
META_BASE = "https://api.llama.com/compat/v1"
OWNER_PIN = "2026"
