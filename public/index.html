<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>La Esquina · Shop Agent</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#ece5dd;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:#efeae2}
header{background:#075e54;color:#fff;padding:12px 16px}header b{display:block}header small{opacity:.8}
#log{flex:1;overflow:auto;padding:12px}.m{max-width:80%;padding:8px 11px;border-radius:8px;margin:6px 0;white-space:pre-wrap;box-shadow:0 1px 1px #0002}
.u{background:#dcf8c6;margin-left:auto}.a{background:#fff}.sys{background:#fff3c4;font-size:13px;margin:6px auto;text-align:center}
#cart{background:#fff;padding:8px 12px;font-size:13px;border-top:1px solid #ddd}
form{display:flex;gap:6px;padding:8px;background:#f0f0f0}input{flex:1;padding:10px;border-radius:20px;border:0}button{background:#075e54;color:#fff;border:0;border-radius:20px;padding:0 16px}
.chips{padding:0 8px 6px;display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#fff;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
a{color:#fff}</style></head><body><div class="app">
<header><b>Panadería La Esquina 🥐</b><small>Asistente de pedidos · ES/EN · <a href="/owner">Owner</a></small></header>
<div id="log"><div class="m a">¡Hola! Soy el asistente de La Esquina. ¿Qué te preparo hoy? / Hi! What can I get started for you?</div></div>
<div class="chips"><span>¿Qué tienen hoy?</span><span>2 pastelitos y un café</span><span>How many points do I have?</span><span>Confirm, name is Ana</span></div>
<div id="cart">Carrito vacío · Puntos: 0</div>
<form id="f"><input id="i" placeholder="Escribe un mensaje / Type a message" autocomplete="off"><button>➤</button></form></div>
<script>
const sid=localStorage.sid||(localStorage.sid=crypto.randomUUID()),phone=localStorage.phone||(localStorage.phone="demo-"+sid.slice(0,6));
const log=document.getElementById('log'),i=document.getElementById('i');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);log.scrollTop=1e9}
function cart(c,p){const t=c.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById('cart').textContent=(c.length?c.map(x=>x.qty+'× '+x.name).join(', ')+' · $'+t.toFixed(2):'Carrito vacío / Empty cart')+' · Puntos: '+p}
async function send(t){add(t,'u');i.value='';const typing=document.createElement('div');typing.className='m a';typing.textContent='…';log.appendChild(typing);
 try{const r=await (await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sid,phone,message:t})})).json();typing.remove();
 add(r.reply||r.error,'a');cart(r.cart||[],r.points||0);if(r.order)add('✅ Pedido #'+r.order.id+' · $'+r.order.total.toFixed(2)+' · listo en ~15 min. Puntos: '+r.points,'sys');}catch(e){typing.textContent='Error'}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();i.value.trim()&&send(i.value.trim())};
document.querySelectorAll('.chips span').forEach(s=>s.onclick=()=>send(s.textContent));
</script></body></html>
